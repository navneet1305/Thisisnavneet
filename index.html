<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navneet || Main Dashboard</title>
    <link rel="stylesheet" href="/css/bottom_nav.css">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/photos.css">
</head>
<body>
<!-- From Uiverse.io by GustavoAlmeidaPuff --> 
<input type="checkbox" id="theme-mode" class="mode" hidden="" />
<div class="container">
  <div class="wrap">
    <input
      checked=""
      type="radio"
      id="rd-1"
      name="radio"
      class="rd-1"
      hidden=""
    />
    <label for="rd-1" class="label" style="--index: 0;"
      ><span>About Me</span></label
    >

    <input type="radio" id="rd-2" name="radio" class="rd-2" hidden="" />
    <label for="rd-2" class="label" style="--index: 1;"
      ><span>Summary</span></label
    >

    <input type="radio" id="rd-3" name="radio" class="rd-3" hidden="" />
    <label for="rd-3" class="label" style="--index: 2;"
      ><span>Portfolio</span></label
    >

    <div class="bar"></div>
    <div class="slidebar"></div>
  </div>
</div>

    <main>



    </main>

    <section id="photos">
        <!-- From Uiverse.io by ilkhoeri --> 
<div class="wrapper">
  <div class="inner" style="--quantity: 10;">
    <div class="card" style="--index: 0;--color-card: 142, 249, 252;">
      <div class="img"></div>
    </div>
    <div class="card" style="--index: 1;--color-card: 142, 252, 204;">
      <div class="img"></div>
    </div>
    <div class="card" style="--index: 2;--color-card: 142, 252, 157;">
      <div class="img"></div>
    </div>
    <div class="card" style="--index: 3;--color-card: 215, 252, 142;">
      <div class="img"></div>
    </div>
    <div class="card" style="--index: 4;--color-card: 252, 252, 142;">
      <div class="img"></div>
    </div>
    <div class="card" style="--index: 5;--color-card: 252, 208, 142;">
      <div class="img"></div>
    </div>
    <div class="card" style="--index: 6;--color-card: 252, 142, 142;">
      <div class="img"></div>
    </div>
    <div class="card" style="--index: 7;--color-card: 252, 142, 239;">
      <div class="img"></div>
    </div>
    <div class="card" style="--index: 8;--color-card: 204, 142, 252;">
      <div class="img"></div>
    </div>
    <div class="card" style="--index: 9;--color-card: 142, 202, 252;">
      <div class="img"></div>
    </div>
  </div>
</div>

    </section>
    
</body>
</html>
